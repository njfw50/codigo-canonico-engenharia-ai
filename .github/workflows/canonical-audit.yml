name: Canonical SI operational checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['14', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # No installation: the example and checks use the standard library.
      - name: Unit and checkout regression tests
        run: npm test
      - name: Reproduce the published synthetic evidence
        run: npm run evaluate -- --check docs/evaluation/delegation-report.json
      - name: Check pinned sources and delegation fixtures
        run: npm run audit
